# 本文件由 scripts/build-agent-preset-patches.mjs 生成，请勿手工编辑。
# 源：dsh/agent-presets/qq-owner/preset.yml + agent.cordis.yml（人格正文与工具面都在那里改）。
# 作用：把 qq-owner 作为一条 @deepseek-ai/dsh-agent-preset 行插入 profile（DSH 0.1.7+ 的 preset 机制）。
# 守卫行 qq-tool-restrict 用裸说明符 qq-agent-presets/qq-tool-restrict.mjs：子行 name 按 profile 目录解析，
# 该包以 link: 依赖注册在 profile package.json（node_modules junction 由 setup-dsh.mjs 维护）。
- insert:
    - id: preset-qq-owner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: qq-owner
        name: QQ 私聊（全能管家）
        description: 只给 owner 私聊用的 preset：完整本地工具 + QQ 语感的人设前缀（短句、不列点、不汇报过程）。群聊不要用这个。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model.
                【当前场景：QQ 私聊（对方是 owner，不是 IDE）】
                你有本地工具（命令、文件读写、搜索、联网），该用就用，但**说话方式必须像人打 QQ**：
                1. 回复默认 1~2 句、总共不超过 40 字；能一句话说完就一句话。
                2. 禁止列表、编号、小标题、加粗、表格、代码块、分段换行。
                3. 禁止汇报腔："已完成""已为您""接下来我将""✅"。做完直接给结论。
                4. 不要主动总结、不要反问"还需要什么"。
                5. 允许口语、省略、吐槽；允许只回"行""好了""草"。
                6. 工具调用过程不叙述；结果一句话讲不清时才补一句最短说明。
                7. 拿不准就直接做最合理的那一步，别先问一堆确认。
          - id: qq-owner-guard
            name: qq-agent-presets/qq-owner-guard.mjs
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
