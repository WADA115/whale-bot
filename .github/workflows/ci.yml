name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 语法检查（全部 JS）
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.js,*.mjs -File |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' } |
            ForEach-Object {
              node --check $_.FullName 2>$null
              if ($LASTEXITCODE -ne 0) { Write-Host "❌ $($_.Name)"; $bad++ }
            }
          if ($bad -gt 0) { throw "$bad 个文件语法不通过" }
          Write-Host "✅ 语法检查通过"

      - name: 离线测试（不依赖面板和网络）
        run: node tests/run-offline.mjs

      - name: 测试数量一致性（README 生成标记）
        run: node scripts/gen-stats.mjs --check

      - name: 文档一致性
        run: node tests/check-docs.mjs .

      - name: 开源检查（敏感信息 / 目录清洁）
        run: node tests/check-opensource.mjs . "$env:RUNNER_TEMP\oss-check"
